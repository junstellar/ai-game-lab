<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 게임 랩 — 혼자, AI로 만드는 미니게임 모음</title>
<meta name="description" content="AI 코딩(바이브 코딩)으로 혼자 만드는 브라우저 미니게임 모음. 로컬 RTX GPU 활용, 공개빌드로 새 게임을 계속 추가합니다.">
<meta name="keywords" content="AI 게임, AI 코딩, 바이브 코딩, vibe coding, AI 게임 만들기, 브라우저 미니게임, 무료 게임">
<meta property="og:title" content="AI 게임 랩">
<meta property="og:description" content="혼자, AI로, 공개적으로 만드는 브라우저 미니게임 모음.">
<link rel="stylesheet" href="shared.css">
<style>
  header.hero{ text-align:center; padding:44px 20px 6px; }
  .hero h1{ margin:0 0 8px; font-size:2rem; letter-spacing:-.5px; }
  .hero .tag{ color:var(--muted); font-size:1rem; margin:0; }
  .hero .pill{ margin-top:16px; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px; margin:28px 0 40px;
  }
  .card{
    display:flex; flex-direction:column; gap:10px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 20px; position:relative; overflow:hidden; color:inherit;
    transition:transform .12s ease, border-color .15s;
  }
  a.card:hover{ transform:translateY(-3px); border-color:#3a4150; text-decoration:none; }
  .card .accent-bar{ position:absolute; left:0; top:0; height:4px; width:100%; }
  .card .emoji{ font-size:2.4rem; line-height:1; }
  .card h2{ margin:0; font-size:1.15rem; }
  .card p{ margin:0; color:var(--muted); font-size:.9rem; flex:1; }
  .card .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; align-items:center; }
  .card.soon{ opacity:.6; }

  /* ── 구분선 + 가로로 긴 카드 ─────────────────────────────────
     미니게임과 결이 다른 게임(3D 등)을 아래쪽에 따로 놓는다.
     폭은 미니게임 카드 3개(=그리드 한 줄) 전체, 높이는 그 1/3. */
  .divider{
    display:flex; align-items:center; gap:14px;
    margin:34px 0 18px; color:var(--muted); font-size:.78rem;
    letter-spacing:.08em; white-space:nowrap;
  }
  .divider::before, .divider::after{ content:''; height:1px; background:var(--border); flex:1; }

  .biggrid{ display:grid; gap:14px; margin:0 0 40px; }
  .card-wide{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:18px;
    min-height:78px; padding:14px 22px 14px 26px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    position:relative; overflow:hidden; color:inherit;
    transition:transform .12s ease, border-color .15s;
  }
  a.card-wide:hover{ transform:translateY(-3px); border-color:#3a4150; text-decoration:none; }
  .card-wide.soon{ opacity:.6; }
  .card-wide .accent-bar{ position:absolute; left:0; top:0; width:4px; height:100%; }
  .card-wide .emoji{ font-size:2.1rem; line-height:1; }
  .card-wide .body{ min-width:0; }             /* ellipsis 가 먹으려면 필요 */
  .card-wide h2{ margin:0 0 3px; font-size:1.1rem; }
  .card-wide p{
    margin:0; color:var(--muted); font-size:.86rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-wide .tags{ display:flex; gap:6px; flex-shrink:0; align-items:center; }

  /* 좁은 화면에서는 태그를 접고 설명을 두 줄까지 허용 */
  @media (max-width:560px){
    .card-wide{ grid-template-columns:auto 1fr; gap:14px; padding:14px 18px 14px 22px; }
    .card-wide .tags{ display:none; }
    .card-wide p{ white-space:normal; }
  }

  footer{
    text-align:center; color:var(--muted); font-size:.85rem;
    padding:28px 20px 50px; border-top:1px solid var(--border);
  }
</style>
</head>
<body>
  <header class="hero">
    <h1>🚀 AI 게임 랩</h1>
    <p class="tag">혼자 · AI로 · 공개적으로 만드는 브라우저 미니게임 모음</p>
    <div class="pill"><span class="badge">🛠️ 새 게임을 계속 추가합니다 · build in public</span></div>
  </header>

  <main class="wrap">
    <div class="grid" id="grid"></div>
    <div class="divider" id="bigDivider" hidden>3D 게임</div>
    <div class="biggrid" id="biggrid"></div>
  </main>

  <footer>
    <p>모든 게임은 <b>AI 코딩(바이브 코딩)</b>으로 만들었습니다 · 만든 사람: <a href="https://junstellar.github.io/">To the Moon</a> · 제작 과정은 블로그에 공개합니다.</p>
  </footer>

  <script src="games.js"></script>
  <script>
    (function(){
      var grid=document.getElementById('grid');
      var big=document.getElementById('biggrid');
      var divider=document.getElementById('bigDivider');
      var games=(window.GAMES||[]);
      if(!games.length){
        grid.innerHTML='<p class="muted">아직 게임이 없어요. 곧 추가됩니다!</p>';
        return;
      }

      function tagsHtml(g, live){
        return (g.tags||[]).map(function(t){ return '<span class="badge">'+t+'</span>'; }).join('')
             + (live ? '' : '<span class="badge badge-soon">곧 공개</span>');
      }
      function shell(g, live, cls){
        var el=document.createElement(live?'a':'div');
        el.className=cls+(live?'':' soon');
        if(live) el.href='./'+g.id+'/';
        return el;
      }

      games.forEach(function(g){
        var live = g.status==='live';
        /* wide:true 인 게임은 아래쪽 별도 영역에 가로로 길게 놓는다 */
        if(g.wide){
          var w=shell(g, live, 'card-wide');
          w.innerHTML=
            '<div class="accent-bar" style="background:'+(g.accent||'var(--accent)')+'"></div>'+
            '<div class="emoji">'+(g.emoji||'🎮')+'</div>'+
            '<div class="body"><h2>'+g.title+'</h2><p>'+g.desc+'</p></div>'+
            '<div class="tags">'+tagsHtml(g,live)+'</div>';
          big.appendChild(w);
          divider.hidden=false;
          return;
        }
        var el=shell(g, live, 'card');
        el.innerHTML=
          '<div class="accent-bar" style="background:'+(g.accent||'var(--accent)')+'"></div>'+
          '<div class="emoji">'+(g.emoji||'🎮')+'</div>'+
          '<h2>'+g.title+'</h2>'+
          '<p>'+g.desc+'</p>'+
          '<div class="tags">'+tagsHtml(g,live)+'</div>';
        grid.appendChild(el);
      });
    })();
  </script>
</body>
</html>
